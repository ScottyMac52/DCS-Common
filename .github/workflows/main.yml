name: Complete Test Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Sets the dummy CI version expected by the packaging scripts
  PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}
  # Defines the root lookup for the shared-hardware scripts
  DCS_COMMON_ROOT: ${{ github.workspace }}/.dcs-common

jobs:
  test-complete-build:
    runs-on: windows-latest

    steps:
      - name: Checkout Consumer Repository
        uses: actions/checkout@v4

      # The reusable workflows explicitly check out both repositories[cite: 3]
      - name: Checkout DCS-Common
        uses: actions/checkout@v4
        with:
          repository: ScottyMac52/DCS-Common
          # You can change this to 'main' once your TPR branch is merged
          ref: main 
          path: .dcs-common

      # The build contract explicitly requires Node.js 22[cite: 3]
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Both reusable workflows pass install-lua-parser: true and run-lua-parse: true[cite: 3]
      # Assuming your project utilizes Luarocks or a specific Lua binary parser setup here
      - name: Setup Lua Parser
        run: |
          echo "Insert your specific Lua parsing/linting command here if it runs outside of the npm scripts."

      # Validates the output is deterministic and dimensions are correct[cite: 3]
      - name: Build Kneeboard
        run: npm run build:kneeboard

      - name: Test Kneeboard
        run: npm run test:kneeboard

      - name: Test Versioning
        run: npm run test:versioning

      # Executes the package scripts using PowerShell (pwsh) as shown in the verification checklist[cite: 3]
      - name: Build OvGME Package
        shell: pwsh
        run: ./scripts/Build-OvGME.ps1 -Version ${{ env.PACKAGE_VERSION }}

      - name: Test OvGME Package
        shell: pwsh
        run: ./scripts/Test-Package.ps1 -Version ${{ env.PACKAGE_VERSION }}

      # Executes the release scripts requested by the run-release-validation flag[cite: 3]
      - name: Build Complete Release
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Version ${{ env.PACKAGE_VERSION }}

      - name: Test Complete Release
        shell: pwsh
        run: ./scripts/Test-Release.ps1 -Version ${{ env.PACKAGE_VERSION }}

      # Uploads the artifact paths specified in both reusable workflow definitions[cite: 3]
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Complete-Test-Build-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
