            "DummyProfile {00000000-0000-0000-0000-000000000000}.diff.lua",
            "OnYourTwelve F-14 PDCP {52C96400-3F11-11f1-8001-444553540000}.diff.lua",
            "WINCTRL CarrierAce PTO 2 {19B7D090-6120-11f0-8001-444553540000}.diff.lua"
          )
          $MockLua = @"
          local diff = {
              ["keyDiffs"] = {
                  ["dnil_1"] = {
                      ["name"] = "Mock Binding 1",
                      ["added"] = {
                          [1] = {
                              ["key"] = "JOY_BTN1"
                          }
