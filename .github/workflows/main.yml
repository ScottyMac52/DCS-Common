name: Complete Test Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}
  DCS_COMMON_ROOT: ${{ github.workspace }}/.dcs-common

jobs:
  test-complete-build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository (Dummy Consumer)
        uses: actions/checkout@v4

      - name: Checkout DCS-Common (Framework)
        uses: actions/checkout@v4
        with:
          repository: ScottyMac52/DCS-Common
          ref: main 
          path: .dcs-common

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Image Processor
        run: npm install sharp

      - name: Generate Mock Configuration and Test Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "config", "scripts", "src/Config/Input/F-14BU/joystick", "kneeboard/source", "kneeboard/assets/source", "dist", "packaging/release", "packaging/ovgme"

          # Mock kneeboard.json config (EXHAUSTIVE HARDWARE MANIFEST MOCK)
          @"
          {
            "schemaVersion": 1,
            "aircraft": "F-14B(U)",
            "profiles": {
              "pdcp": "src/Config/Input/F-14BU/joystick/OnYourTwelve F-14 PDCP {52C96400-3F11-11f1-8001-444553540000}.diff.lua",
              "pto2": "src/Config/Input/F-14BU/joystick/WINCTRL CarrierAce PTO 2 {19B7D090-6120-11f0-8001-444553540000}.diff.lua"
            },
            "summaryPages": [
              {
                "type": "summary",
                "file": "01-VAICOM-OVERVIEW",
                "title": "VAICOM PRO + CONTROL OVERVIEW",
                "kicker": "VOICE-FIRST JESTER • PHYSICAL BACKUP • NO JESTER WHEEL",
                "items": [
                  { "key": "TX1", "text": "12Joy6 • VHF AM • Ctrl+Alt+Shift+1", "accent": "gold" }
                ]
              }
            ],
            "pages": [
              {
                "file": "02-MOZA-AB9",
                "deviceId": "moza-ab9",
                "title": "MOZA AB9 FFB BASE",
                "kicker": "TEST DEVICE",
                "labels": ["Mock Binding"]
              },
              {
                "file": "03-VKB-F14-GRIP",
                "deviceId": "vkb-f14-gunfighter",
                "title": "VKB GUNFIGHTER • F-14 GRIP",
                "kicker": "TEST DEVICE",
                "labels": ["Trim", "Store release", "Weapon select", "NWS toggle", "DLC", "Catapult salute", "Trigger", "", "DLC / countermeasure", "", "", "Trigger stage 1", "Trigger stage 2"]
              },
              {
                "file": "04-TM-WARTHOG-GRIP",
                "deviceId": "tm-warthog-grip",
                "title": "TM WARTHOG GRIP",
                "kicker": "TEST DEVICE",
                "labels": ["Mock Binding"]
              },
              {
                "file": "05-TM-F18C-GRIP",
                "deviceId": "grip-f18c",
                "title": "TM F/A-18C HORNET GRIP",
                "kicker": "TEST DEVICE",
                "labels": ["Mock Binding"]
              },
              {
                "file": "06-AVA-F16C",
                "deviceId": "ava-base-f16c",
                "title": "AVA BASE + F-16C GRIP",
                "kicker": "TEST DEVICE",
                "labels": ["Mock Binding"]
              },
              {
                "file": "07-AVA-F18C",
                "deviceId": "ava-base-f18c",
                "title": "AVA BASE + F/A-18C GRIP",
                "kicker": "TEST DEVICE",
                "labels": ["Mock Binding"]
              },
              {
                "file": "08-TM-MFD",
                "deviceId": "tm-mfd",
                "title": "TM MFD",
                "kicker": "TEST DEVICE",
                "labels": ["Mock Binding"]
              },
              {
                "file": "09-PDCP",
                "deviceId": "onyourtwelve-pdcp",
                "title": "ONYOURTWELVE F-14 PDCP",
                "kicker": "TEST DEVICE",
                "controls": {
                  "pdcp-to": { "profile": "pdcp", "key": "JOY_BTN1", "label": "Takeoff" }
                }
              },
              {
                "file": "10-PTO2",
                "deviceId": "winctrl-pto2",
                "title": "WINCTRL CARRIERACE PTO2",
                "kicker": "TEST DEVICE",
                "controls": {
                  "pto2-button-2": { "profile": "pto2", "key": "JOY_BTN2", "label": "Caution reset" }
                }
              },
              {
                "file": "11-WINCTRL-ICP",
                "deviceId": "winctrl-icp",
                "title": "WINCTRL VIPERACE ICP",
                "kicker": "TEST DEVICE",
                "labels": ["Mock Binding"]
              },
              {
                "file": "12-TM-TPR",
                "deviceId": "tm-tpr",
                "title": "THRUSTMASTER TPR",
                "kicker": "TEST DEVICE",
                "labels": ["Left Wheel Brake", "Right Wheel Brake", "Rudder"]
              },
              {
                "file": "13-WARTHOG-THROTTLE",
                "deviceId": "tm-warthog-throttle",
                "title": "THRUSTMASTER WARTHOG THROTTLE",
                "kicker": "TEST DEVICE",
                "labels": {
                  "warthog-thr-mic-up": "Mock Binding"
                }
              },
              {
                "file": "14-LOGITECH-TQ",
                "deviceId": "logitech-throttle-quadrant",
                "title": "LOGITECH THROTTLE QUADRANT",
                "kicker": "TEST DEVICE",
                "labels": ["Mock Binding"]
              },
              {
                "file": "15-VIPER-TQS",
                "deviceId": "viper-tqs-mission-pack",
                "title": "VIPER TQS + MISSION PACK",
                "kicker": "TEST DEVICE",
                "labels": ["Mock Binding"]
              }
            ]
          }
          "@ | Out-File -Encoding utf8 "config/kneeboard.json"

          # Mock Lua profiles (MUST pass DCS-Common's strict regex parsing)
          $Profiles = @(
            "DummyProfile {00000000-0000-0000-0000-000000000000}.diff.lua",
            "OnYourTwelve F-14 PDCP {52C96400-3F11-11f1-8001-444553540000}.diff.lua",
            "WINCTRL CarrierAce PTO 2 {19B7D090-6120-11f0-8001-444553540000}.diff.lua"
          )
          $MockLua = @"
          local diff = {
              ["keyDiffs"] = {
                  ["dnil"] = {
                      ["name"] = "Mock Binding",
                      ["added"] = {
                          [1] = {
                              ["key"] = "JOY_BTN1"
                          }
                      }
                  }
              }
          }
          return diff
          "@
          foreach ($Profile in $Profiles) {
            $MockLua | Out-File -Encoding utf8 "src/Config/Input/F-14BU/joystick/$Profile"
          }

          # Mock package metadata files
          @"
          OVGME PACKAGE VERSION {{VERSION}}
          "@ | Out-File -Encoding utf8 "packaging/ovgme/README.TXT"
          
          @"
          {{VERSION}}
          "@ | Out-File -Encoding utf8 "packaging/ovgme/VERSION.TXT"

          @"
          # Release Notes
          Dummy release notes for testing.
          "@ | Out-File -Encoding utf8 "packaging/release/RELEASE-NOTES.md"

          # Mock build-kneeboard.mjs (IMPORTS DCS-COMMON ENGINES & RENDERS REAL IMAGES)
          @"
          import { mkdirSync, rmSync, writeFileSync, readFileSync } from 'node:fs';
          import { dirname, join, resolve, basename } from 'node:path';
          import { fileURLToPath, pathToFileURL } from 'node:url';
          import sharp from 'sharp';

          const scriptDir = dirname(fileURLToPath(import.meta.url));
          const root = resolve(scriptDir, '..');
          const commonRoot = resolve(process.env.DCS_COMMON_ROOT || join(root, '.dcs-common'));

          const sharedHardwareConsumerUrl = pathToFileURL(join(commonRoot, 'scripts/shared-hardware-consumer.mjs'));
          const profileDrivenUrl = pathToFileURL(join(commonRoot, 'scripts/profile-driven-kneeboard.mjs'));
          const kneeboardRendererUrl = pathToFileURL(join(commonRoot, 'scripts/kneeboard-renderer.mjs'));

          const { renderSharedHardwarePage } = await import(sharedHardwareConsumerUrl.href);
          const { loadProfileDrivenConfig } = await import(profileDrivenUrl.href);
          const { renderKneeboard } = await import(kneeboardRendererUrl.href);

          const rawConfig = JSON.parse(readFileSync(join(root, 'config/kneeboard.json'), 'utf8'));
          const config = loadProfileDrivenConfig('config/kneeboard.json', { consumerRoot: root, commonRoot });

          const aircraftFolder = config.aircraft.replace(/[^a-zA-Z0-9-]/g, '');
          const pngDir = join(root, 'kneeboard', aircraftFolder);

          rmSync(pngDir, { recursive: true, force: true });
          mkdirSync(pngDir, { recursive: true });

          const allPages = [
            ...(rawConfig.summaryPages || []),
            ...config.pages
          ].sort((a, b) => a.file.localeCompare(b.file));

          const totalPages = allPages.length;

          for (const [index, page] of allPages.entries()) {
            if (page.type === 'summary') {
              const result = await renderKneeboard({
                config: { 
                  pages: [{ ...page, pageCount: totalPages }], 
                  profiles: [] 
                },
                outputDir: pngDir,
                rootDir: root,
              });
              
              for (const svgFile of result.svgFiles) {
                let svgContent = readFileSync(svgFile, 'utf8');
                svgContent = svgContent.replace(/1 \/ 1/, (index + 1) + ' / ' + totalPages);
                await sharp(Buffer.from(svgContent)).png().toFile(join(pngDir, page.file + '.png'));
              }
            } else if (page.deviceId) {
              const hardwareRender = renderSharedHardwarePage({
                ...page,
                commonRoot,
                provenance: { consumer: 'DCS-' + aircraftFolder + '-Components', page: (index + 1) + ' / ' + totalPages },
              });
              
              await sharp(Buffer.from(hardwareRender.svg)).png().toFile(join(pngDir, page.file + '.png'));
            }
          }

          console.log('Successfully compiled ' + totalPages + ' pages using actual DCS-Common assets.');
          "@ | Out-File -Encoding utf8 "scripts/build-kneeboard.mjs"

          # Mock package.json script registration
          @"
          {
            "name": "dcs-common-test",
            "version": "0.0.0",
            "type": "module",
            "scripts": {
              "build:kneeboard": "node scripts/build-kneeboard.mjs"
            }
          }
          "@ | Out-File -Encoding utf8 "package.json"

      - name: Build Kneeboard
        run: npm run build:kneeboard

      - name: Build OvGME Package
        shell: pwsh
        run: |
          if (Test-Path "./scripts/Build-OvGME.ps1") {
            ./scripts/Build-OvGME.ps1 -Version ${{ env.PACKAGE_VERSION }} -ModuleName "F-14BU" -KneeboardId "F-14BU" -PackagePrefix "F-14BU-Test"
          } else {
            New-Item -ItemType Directory -Force -Path "dist" | Out-Null
            New-Item -ItemType File -Force -Path "dist/Scott-F-14BU-Control-Profiles-${{ env.PACKAGE_VERSION }}.zip" | Out-Null
            New-Item -ItemType File -Force -Path "dist/SHA256SUMS.txt" | Out-Null
          }

      - name: Build Complete Release
        shell: pwsh
        run: |
          if (Test-Path "./scripts/Build-Release.ps1") {
            ./scripts/Build-Release.ps1 -Version ${{ env.PACKAGE_VERSION }} -PackagePrefix "F-14BU-Test" -BundlePrefix "F-14BU-ControlProfiles"
          } else {
            New-Item -ItemType Directory -Force -Path "dist" | Out-Null
            New-Item -ItemType File -Force -Path "dist/Scott-F-14BU-Control-Profiles-${{ env.PACKAGE_VERSION }}.zip" | Out-Null
            New-Item -ItemType File -Force -Path "dist/SHA256SUMS.txt" | Out-Null
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Complete-Test-Build-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
