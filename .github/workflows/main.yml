name: Complete Test Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}
  DCS_COMMON_ROOT: ${{ github.workspace }}/.dcs-common

jobs:
  test-complete-build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Mock Consumer Scripts and Configuration
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "config", "scripts", "src/Config/Input/F-14BU/joystick", "kneeboard/source", "kneeboard/assets/source", "dist", "packaging/release"

          # 1. Mock kneeboard.json config
          @"
          {
            "schemaVersion": 1,
            "aircraft": "F-14B(U)",
            "profiles": {
              "dummy": "src/Config/Input/F-14BU/joystick/DummyProfile {00000000-0000-0000-0000-000000000000}.diff.lua"
            },
            "summaryPages": [
              {
                "type": "summary",
                "file": "01-VAICOM-OVERVIEW",
                "title": "TEST SUMMARY",
                "kicker": "FAKE DATA CONFIGURATION",
                "items": [
                  { "key": "TST", "text": "Dummy test line for validation", "accent": "gold" }
                ]
              }
            ],
            "pages": [
              {
                "file": "02-TEST-DEVICE",
                "deviceId": "tm-mfd",
                "title": "TEST DEVICE",
                "kicker": "HARDWARE MOCK",
                "labels": ["BTN 1", "BTN 2", "BTN 3", "BTN 4", "BTN 5", "BTN 6", "BTN 7", "BTN 8", "BTN 9", "BTN 10", "BTN 11", "BTN 12", "BTN 13", "BTN 14", "BTN 15", "BTN 16", "BTN 17", "BTN 18", "BTN 19", "BTN 20", "BTN 21", "BTN 22", "BTN 23", "BTN 24", "BTN 25", "BTN 26", "BTN 27", "BTN 28"]
              }
            ]
          }
          "@ | Out-File -Encoding utf8 "config/kneeboard.json"

          # 2. Mock Lua profile
          @"
          return {}
          "@ | Out-File -Encoding utf8 "src/Config/Input/F-14BU/joystick/DummyProfile {00000000-0000-0000-0000-000000000000}.diff.lua"

          # 3. Mock package metadata files
          @"
          OVGME PACKAGE VERSION ${{ env.PACKAGE_VERSION }}
          "@ | Out-File -Encoding utf8 "README.TXT"
          
          @"
          ${{ env.PACKAGE_VERSION }}
          "@ | Out-File -Encoding utf8 "VERSION.TXT"

          @"
          # Release Notes
          Dummy release notes for testing.
          "@ | Out-File -Encoding utf8 "packaging/release/RELEASE-NOTES.md"

          # 4. Mock build-kneeboard.mjs script referenced by consumer builds
          @"
          import { mkdirSync, rmSync, writeFileSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';
          const root = resolve(dirname(fileURLToPath(import.meta.url)), '..');
          mkdirSync(join(root, 'kneeboard', 'F-14BU'), { recursive: true });
          writeFileSync(join(root, 'kneeboard', 'F-14BU', '01-VAICOM-OVERVIEW.png'), Buffer.from('dummy'));
          writeFileSync(join(root, 'kneeboard', 'F-14BU', '02-TEST-DEVICE.png'), Buffer.from('dummy'));
          console.log('Mock kneeboard build completed.');
          "@ | Out-File -Encoding utf8 "scripts/build-kneeboard.mjs"

          # 5. Mock PowerShell build scripts for OvGME and Releases
          @"
          param([string]$Version)
          $RepoRoot = Split-Path -Parent $PSScriptRoot
          $Dist = Join-Path $RepoRoot "dist"
          New-Item -ItemType Directory -Force -Path $Dist | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $Dist "Scott-F-14BU-Control-Profiles-$Version.zip") | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $Dist "SHA256SUMS.txt") | Out-Null
          Write-Host "Mock build complete."
          "@ | Out-File -Encoding utf8 "scripts/Build-OvGME.ps1"

          Copy-Item "scripts/Build-OvGME.ps1" "scripts/Build-Release.ps1" -Force

          # 6. Mock package.json script registration
          @"
          {
            "name": "dcs-common-test",
            "version": "0.0.0",
            "scripts": {
              "build:kneeboard": "node scripts/build-kneeboard.mjs"
            }
          }
          "@ | Out-File -Encoding utf8 "package.json"

      - name: Build Kneeboard
        run: npm run build:kneeboard

      - name: Build OvGME Package
        shell: pwsh
        run: ./scripts/Build-OvGME.ps1 -Version ${{ env.PACKAGE_VERSION }}

      - name: Build Complete Release
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Version ${{ env.PACKAGE_VERSION }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Complete-Test-Build-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
