name: Complete Test Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}
  DCS_COMMON_ROOT: ${{ github.workspace }}/.dcs-common

jobs:
  test-complete-build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository (Dummy Consumer)
        uses: actions/checkout@v4

      - name: Checkout DCS-Common (Framework)
        uses: actions/checkout@v4
        with:
          repository: ScottyMac52/DCS-Common
          # On PRs, test the PR head so framework changes in the PR are exercised.
          # On workflow_dispatch, fall back to main.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          path: .dcs-common

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Image Processor
        run: npm install sharp

      - name: Generate Mock Configuration and Test Artifacts
        shell: pwsh
        run: |
          # Generate every test page and profile from the authoritative Lua catalogs.
          node "$env:DCS_COMMON_ROOT/scripts/generate-complete-build-mock.mjs" "$PWD" "$env:DCS_COMMON_ROOT"

          # Mock package metadata files
          @"
          OVGME PACKAGE VERSION {{VERSION}}
          "@ | Out-File -Encoding utf8 "packaging/ovgme/README.TXT"
          
          @"
          {{VERSION}}
          "@ | Out-File -Encoding utf8 "packaging/ovgme/VERSION.TXT"

          @"
          # Release Notes
          Dummy release notes for testing.
          "@ | Out-File -Encoding utf8 "packaging/release/RELEASE-NOTES.md"

          # Mock build-kneeboard.mjs (IMPORTS DCS-COMMON ENGINES & RENDERS REAL IMAGES)
          @"
          import { mkdirSync, rmSync, writeFileSync, readFileSync } from 'node:fs';
          import { dirname, join, resolve, basename } from 'node:path';
          import { fileURLToPath, pathToFileURL } from 'node:url';
          import sharp from 'sharp';

          const scriptDir = dirname(fileURLToPath(import.meta.url));
          const root = resolve(scriptDir, '..');
          const commonRoot = resolve(process.env.DCS_COMMON_ROOT || join(root, '.dcs-common'));

          const sharedHardwareConsumerUrl = pathToFileURL(join(commonRoot, 'scripts/shared-hardware-consumer.mjs'));
          const profileDrivenUrl = pathToFileURL(join(commonRoot, 'scripts/profile-driven-kneeboard.mjs'));
          const kneeboardRendererUrl = pathToFileURL(join(commonRoot, 'scripts/kneeboard-renderer.mjs'));

          const { renderSharedHardwarePage } = await import(sharedHardwareConsumerUrl.href);
          const { loadProfileDrivenConfig } = await import(profileDrivenUrl.href);
          const { renderKneeboard } = await import(kneeboardRendererUrl.href);

          const rawConfig = JSON.parse(readFileSync(join(root, 'config/kneeboard.json'), 'utf8'));
          const config = loadProfileDrivenConfig('config/kneeboard.json', { consumerRoot: root, commonRoot });

          const aircraftFolder = config.aircraft.replace(/[^a-zA-Z0-9-]/g, '');
          const pngDir = join(root, 'kneeboard', aircraftFolder);

          rmSync(pngDir, { recursive: true, force: true });
          mkdirSync(pngDir, { recursive: true });

          const allPages = [
            ...(rawConfig.summaryPages || []),
            ...config.pages
          ].sort((a, b) => a.file.localeCompare(b.file));

          const totalPages = allPages.length;

          for (const [index, page] of allPages.entries()) {
            if (page.type === 'summary') {
              const result = await renderKneeboard({
                config: { 
                  pages: [{ ...page, pageCount: totalPages }], 
                  profiles: [] 
                },
                outputDir: pngDir,
                rootDir: root,
              });
              
              for (const svgFile of result.svgFiles) {
                let svgContent = readFileSync(svgFile, 'utf8');
                svgContent = svgContent.replace(/1 \/ 1/, (index + 1) + ' / ' + totalPages);
                await sharp(Buffer.from(svgContent)).png().toFile(join(pngDir, page.file + '.png'));
              }
            } else if (page.deviceId) {
              const hardwareRender = renderSharedHardwarePage({
                ...page,
                commonRoot,
                provenance: { consumer: 'DCS-' + aircraftFolder + '-Components', page: (index + 1) + ' / ' + totalPages },
              });
              
              await sharp(Buffer.from(hardwareRender.svg)).png().toFile(join(pngDir, page.file + '.png'));
            }
          }

          console.log('Successfully compiled ' + totalPages + ' pages using actual DCS-Common assets.');
          "@ | Out-File -Encoding utf8 "scripts/build-kneeboard.mjs"

          # Mock package.json script registration
          @"
          {
            "name": "dcs-common-test",
            "version": "0.0.0",
            "type": "module",
            "scripts": {
              "build:kneeboard": "node scripts/build-kneeboard.mjs"
            }
          }
          "@ | Out-File -Encoding utf8 "package.json"

      - name: Build Kneeboard
        run: npm run build:kneeboard

      - name: Build OvGME Package
        shell: pwsh
        run: |
          if (Test-Path "./scripts/Build-OvGME.ps1") {
            ./scripts/Build-OvGME.ps1 -Version ${{ env.PACKAGE_VERSION }} -ModuleName "Test" -KneeboardId "Test" -PackagePrefix "Master-Test"
          } else {
            New-Item -ItemType Directory -Force -Path "dist" | Out-Null
            New-Item -ItemType File -Force -Path "dist/Scott-Test-Control-Profiles-${{ env.PACKAGE_VERSION }}.zip" | Out-Null
            New-Item -ItemType File -Force -Path "dist/SHA256SUMS.txt" | Out-Null
          }

      - name: Build Complete Release
        shell: pwsh
        run: |
          if (Test-Path "./scripts/Build-Release.ps1") {
            ./scripts/Build-Release.ps1 -Version ${{ env.PACKAGE_VERSION }} -PackagePrefix "Master-Test" -BundlePrefix "ControlProfiles"
          } else {
            New-Item -ItemType Directory -Force -Path "dist" | Out-Null
            New-Item -ItemType File -Force -Path "dist/Scott-Test-Control-Profiles-${{ env.PACKAGE_VERSION }}.zip" | Out-Null
            New-Item -ItemType File -Force -Path "dist/SHA256SUMS.txt" | Out-Null
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Complete-Test-Build-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
