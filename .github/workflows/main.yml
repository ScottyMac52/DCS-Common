name: Complete Test Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}
  DCS_COMMON_ROOT: ${{ github.workspace }}/.dcs-common

jobs:
  test-complete-build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository (Dummy Consumer)
        uses: actions/checkout@v4

      - name: Checkout DCS-Common (Framework)
        uses: actions/checkout@v4
        with:
          repository: ScottyMac52/DCS-Common
          # On PRs, test the PR head so framework changes in the PR are exercised.
          # On workflow_dispatch, fall back to main.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          path: .dcs-common

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .dcs-common/package-lock.json

      - name: Install DCS-Common Dependencies
        run: npm ci --prefix "$env:DCS_COMMON_ROOT"

      - name: Generate Mock Configuration and Test Artifacts
        shell: pwsh
        run: |
          # Generate every test page, profile, and rendered kneeboard from the authoritative Lua catalogs.
          node "$env:DCS_COMMON_ROOT/scripts/generate-test-articles.mjs" "$PWD" "$env:DCS_COMMON_ROOT"

          # Verify that every manifest device produced a mock profile and a rendered kneeboard.
          node --test "$env:DCS_COMMON_ROOT/test/complete-build-mock.test.mjs"

          $manifest = Get-Content "$env:DCS_COMMON_ROOT/assets/shared/hardware/manifest.json" | ConvertFrom-Json
          foreach ($device in $manifest.devices) {
            $profile = "src/Config/Input/Test/joystick/$($device.id).diff.lua"
            $pngPattern = "kneeboard/Test/*-$($device.id.ToUpper()).png"
            $lua = Get-Content "$env:DCS_COMMON_ROOT/assets/shared/hardware/$($device.lua)" -Raw
            if ($lua -match 'schemaVersion\s*=\s*1' -and -not (Test-Path $profile)) {
              throw "Missing mocked profile: $profile"
            }
            if (-not (Get-ChildItem $pngPattern -ErrorAction SilentlyContinue)) { throw "Missing rendered kneeboard: $pngPattern" }
          }

          # Mock package metadata files
          @"
          OVGME PACKAGE VERSION {{VERSION}}
          "@ | Out-File -Encoding utf8 "packaging/ovgme/README.TXT"
          
          @"
          {{VERSION}}
          "@ | Out-File -Encoding utf8 "packaging/ovgme/VERSION.TXT"

          @"
          # Release Notes
          Dummy release notes for testing.
          "@ | Out-File -Encoding utf8 "packaging/release/RELEASE-NOTES.md"


      - name: Build OvGME Package
        shell: pwsh
        run: |
          if (Test-Path "./scripts/Build-OvGME.ps1") {
            ./scripts/Build-OvGME.ps1 -Version ${{ env.PACKAGE_VERSION }} -ModuleName "Test" -KneeboardId "Test" -PackagePrefix "Master-Test"
          } else {
            New-Item -ItemType Directory -Force -Path "dist" | Out-Null
            New-Item -ItemType File -Force -Path "dist/Scott-Test-Control-Profiles-${{ env.PACKAGE_VERSION }}.zip" | Out-Null
            New-Item -ItemType File -Force -Path "dist/SHA256SUMS.txt" | Out-Null
          }

      - name: Build Complete Release
        shell: pwsh
        run: |
          if (Test-Path "./scripts/Build-Release.ps1") {
            ./scripts/Build-Release.ps1 -Version ${{ env.PACKAGE_VERSION }} -PackagePrefix "Master-Test" -BundlePrefix "ControlProfiles"
          } else {
            New-Item -ItemType Directory -Force -Path "dist" | Out-Null
            New-Item -ItemType File -Force -Path "dist/Scott-Test-Control-Profiles-${{ env.PACKAGE_VERSION }}.zip" | Out-Null
            New-Item -ItemType File -Force -Path "dist/SHA256SUMS.txt" | Out-Null
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Complete-Test-Build-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
