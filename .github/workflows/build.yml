name: Reusable build workflow

on:
  workflow_call:
    outputs:
      generated-commit-sha:
        description: Commit containing the kneeboard pages packaged by this run.
        value: ${{ jobs.build.outputs.generated-commit-sha }}
      generated-commit-url:
        description: URL of the commit containing the kneeboard pages packaged by this run.
        value: ${{ jobs.build.outputs.generated-commit-url }}
    inputs:
      package-version:
        required: false
        type: string
        default: 0.0.0-ci.${{ github.run_number }}
      dcs-common-ref:
        required: false
        type: string
        default: main
      install-lua-parser:
        required: false
        type: boolean
        default: false
      run-lua-parse:
        required: false
        type: boolean
        default: false
      run-autohotkey-tests:
        required: false
        type: boolean
        default: false
      run-release-validation:
        required: false
        type: boolean
        default: false
      run-release-build:
        required: false
        type: boolean
        default: false
      extra-validation-command:
        required: false
        type: string
        default: ''
      package-script:
        required: true
        type: string
      test-package-script:
        required: true
        type: string
      build-release-script:
        required: true
        type: string
      test-release-script:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
      artifact-path:
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: '22'
      runs-on:
        required: false
        type: string
        default: ubuntu-latest
      install-command:
        required: false
        type: string
        default: npm ci
      build-command:
        required: false
        type: string
        default: npm run build:kneeboard
      test-kneeboard-command:
        required: false
        type: string
        default: npm run test:kneeboard
      test-versioning-command:
        required: false
        type: string
        default: npm run test:versioning
      package-root:
        required: false
        type: string
        default: .
      # When true, commit regenerated kneeboard SVG/PNG back to the default branch
      # after generate+validate and before packaging. Only runs on push to main
      # or workflow_dispatch (never on pull_request). Caller must grant contents: write.
      commit-kneeboard:
        required: false
        type: boolean
        default: false
      kneeboard-paths:
        required: false
        type: string
        default: 'kneeboard/source kneeboard/F-16C_50'

jobs:
  build:
    outputs:
      generated-commit-sha: ${{ steps.commit_kneeboard.outputs.generated-commit-sha }}
      generated-commit-url: ${{ steps.commit_kneeboard.outputs.generated-commit-url }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ inputs.package-version }}
      DCS_COMMON_ROOT: ${{ github.workspace }}/.dcs-common
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so a subsequent push can update main when commit-kneeboard is enabled.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Check out shared DCS-Common assets
        uses: actions/checkout@v4
        with:
          repository: ScottyMac52/DCS-Common
          ref: ${{ inputs.dcs-common-ref }}
          path: .dcs-common
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install Lua parser
        if: ${{ inputs.install-lua-parser }}
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Install build dependencies
        run: ${{ inputs.install-command }}
      - name: Test semantic versioning
        run: ${{ inputs.test-versioning-command }}
      - name: Run repository-specific validation
        if: ${{ inputs.extra-validation-command != '' }}
        shell: pwsh
        run: ${{ inputs.extra-validation-command }}
      - name: Parse Lua profiles
        if: ${{ inputs.run-lua-parse }}
        shell: pwsh
        run: |
          Set-Location '${{ inputs.package-root }}'
          Get-ChildItem src -Recurse -Filter '*.lua' | ForEach-Object {
            & luac5.4 -p $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Invalid Lua: $($_.FullName)" }
          }
      - name: Generate OpenKneeboard pages
        run: ${{ inputs.build-command }}
      - name: Validate OpenKneeboard pages
        run: ${{ inputs.test-kneeboard-command }}
      - name: Commit regenerated kneeboard pages
        id: commit_kneeboard
        if: >-
          ${{ inputs.commit-kneeboard
              && github.event_name != 'pull_request'
              && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        shell: pwsh
        env:
          TRIGGER_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          Set-Location '${{ inputs.package-root }}'
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ${{ inputs.kneeboard-paths }}

          $status = git status --porcelain ${{ inputs.kneeboard-paths }}
          if ([string]::IsNullOrWhiteSpace($status)) {
            $CurrentSha = git rev-parse HEAD
            $CurrentUrl = "https://github.com/$env:REPOSITORY/commit/$CurrentSha"
            "generated-commit-sha=$CurrentSha" >> $env:GITHUB_OUTPUT
            "generated-commit-url=$CurrentUrl" >> $env:GITHUB_OUTPUT
            @"
          ## Kneeboard generation provenance

          | Revision | Commit |
          | --- | --- |
          | Workflow trigger | [$($env:TRIGGER_SHA.Substring(0, 7))](https://github.com/$env:REPOSITORY/commit/$env:TRIGGER_SHA) |
          | Packaged kneeboards | [$($CurrentSha.Substring(0, 7))]($CurrentUrl) |

          The generated kneeboards were already current, so no follow-up commit was required.
          "@ >> $env:GITHUB_STEP_SUMMARY
            Write-Host 'Kneeboard pages are already up to date; nothing to commit.'
            return
          }

          git commit -m "chore: regenerate kneeboard pages for package $env:PACKAGE_VERSION [skip ci]"
          git push origin HEAD:main

          $NewSha = git rev-parse HEAD
          $NewUrl = "https://github.com/$env:REPOSITORY/commit/$NewSha"
          "generated-commit-sha=$NewSha" >> $env:GITHUB_OUTPUT
          "generated-commit-url=$NewUrl" >> $env:GITHUB_OUTPUT
          @"
          ## Kneeboard generation provenance

          | Revision | Commit |
          | --- | --- |
          | Workflow trigger | [$($env:TRIGGER_SHA.Substring(0, 7))](https://github.com/$env:REPOSITORY/commit/$env:TRIGGER_SHA) |
          | Packaged kneeboards | [$($NewSha.Substring(0, 7))]($NewUrl) |

          > GitHub permanently associates this run with the trigger commit. The **Packaged kneeboards** commit above contains the generated SVG/PNG files used by this run and is the revision to inspect.
          "@ >> $env:GITHUB_STEP_SUMMARY
          Write-Host "Pushed regenerated kneeboard pages as $NewSha"
      - name: Build package
        shell: pwsh
        run: |
          Set-Location '${{ inputs.package-root }}'
          ./${{ inputs.package-script }} -Version $env:PACKAGE_VERSION
      - name: Validate package
        shell: pwsh
        run: |
          Set-Location '${{ inputs.package-root }}'
          ./${{ inputs.test-package-script }} -Version $env:PACKAGE_VERSION
      - name: Validate AutoHotKey bridge
        if: ${{ inputs.run-autohotkey-tests }}
        shell: pwsh
        run: |
          Set-Location '${{ inputs.package-root }}'
          ./scripts/Test-AutoHotKey.ps1
      - name: Build complete release bundle
        if: ${{ inputs.run-release-build || inputs.run-release-validation }}
        shell: pwsh
        run: |
          Set-Location '${{ inputs.package-root }}'
          ./${{ inputs.build-release-script }} -Version $env:PACKAGE_VERSION
      - name: Validate complete release bundle
        if: ${{ inputs.run-release-validation }}
        shell: pwsh
        run: |
          Set-Location '${{ inputs.package-root }}'
          ./${{ inputs.test-release-script }} -Version $env:PACKAGE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            ${{ inputs.artifact-path }}
