name: Scaffold app CI / Build / Release

# Tag releases: four-part only (vMAJOR.MINOR.PATCH.BUILD).
# Path filters apply to PRs only — tag pushes must always run the release job.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*.*'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/DcsConsumerScaffold/**'
      - 'scripts/scaffold-consumer.mjs'
      - 'templates/consumer/**'
      - 'assets/shared/hardware/scaffold-device-map.json'
      - '.github/workflows/scaffold-app.yml'
  workflow_dispatch:

# Default read; release job elevates for softprops/action-gh-release.
permissions:
  contents: read

jobs:
  ci:
    name: CI (Tests + Coverage)
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    uses: ScottyMac52/shared-github-workflows/.github/workflows/reusable-build-and-release.yml@main
    with:
      dotnet_version: '10.0.x'
      run_tests: true
      run_coverage: true
      run_build_release: false
      ci_mode: true
      create_release: false
    secrets: inherit

  build:
    name: Build on PR / Main
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    uses: ScottyMac52/shared-github-workflows/.github/workflows/reusable-build-and-release.yml@main
    with:
      dotnet_version: '10.0.x'
      run_tests: true
      run_coverage: true
      run_build_release: true
      ci_mode: false
      create_release: false
      enable_installer: false
    secrets: inherit

  release:
    name: Full Build + Inno Release (Tag)
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: ScottyMac52/shared-github-workflows/.github/workflows/reusable-build-and-release.yml@main
    with:
      dotnet_version: '10.0.x'
      run_tests: true
      run_coverage: true
      run_build_release: true
      ci_mode: false
      create_release: true
      enable_installer: true
      installer_iss_path: tools/DcsConsumerScaffold/installer/installer.iss
      app_publisher: 'Vyper Industries'
    secrets: inherit
